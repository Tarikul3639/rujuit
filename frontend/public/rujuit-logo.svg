<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="340 100 860 740"
   width="860"
   height="740"
   version="1.1"
   id="svg16"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:c2pa="http://c2pa.org/manifest">
  <title
     id="title1">R Logo</title>
  <defs
     id="defs16">
    <!-- Top bar: bright yellow (top-right) to golden (left) -->
    <linearGradient
       id="gradTop"
       gradientUnits="userSpaceOnUse"
       x1="480"
       y1="300"
       x2="1000"
       y2="130">
      <stop
         offset="0"
         stop-color="#FFB400"
         id="stop1" />
      <stop
         offset="0.45"
         stop-color="#FFD400"
         id="stop2" />
      <stop
         offset="1"
         stop-color="#FFF500"
         id="stop3" />
    </linearGradient>
    <!-- Orange fold inside the bowl: dark red-orange to orange -->
    <linearGradient
       id="gradFold"
       gradientUnits="userSpaceOnUse"
       x1="1000"
       y1="281"
       x2="943.43042"
       y2="478.41418">
      <stop
         offset="0"
         stop-color="#C83200"
         id="stop4" />
      <stop
         offset="0.66200304"
         stop-color="#FF8A00"
         id="stop5" />
      <stop
         offset="1"
         stop-color="#FFC400"
         id="stop6" />
    </linearGradient>
    <!-- Lower bowl: yellow -->
    <!-- Left leg: yellow tip, orange body -->
    <linearGradient
       id="gradLeg"
       gradientUnits="userSpaceOnUse"
       x1="365"
       y1="806"
       x2="760"
       y2="500">
      <stop
         offset="0"
         stop-color="#FFD000"
         id="stop9" />
      <stop
         offset="0.3"
         stop-color="#FF8A00"
         id="stop10" />
      <stop
         offset="0.65"
         stop-color="#FF7A00"
         id="stop11" />
      <stop
         offset="1"
         stop-color="#FFC000"
         id="stop12" />
    </linearGradient>
    <!-- Gray right leg: dark navy to light slate -->
    <linearGradient
       id="gradGray"
       gradientUnits="userSpaceOnUse"
       x1="800"
       y1="600"
       x2="1100"
       y2="806">
      <stop
         offset="0"
         stop-color="#12141D"
         id="stop13" />
      <stop
         offset="1"
         stop-color="#737A90"
         id="stop14" />
    </linearGradient>
    <!-- Connector line -->
    <linearGradient
       id="gradLine"
       gradientUnits="userSpaceOnUse"
       x1="500"
       y1="530"
       x2="640"
       y2="410">
      <stop
         offset="0"
         stop-color="#FFB000"
         id="stop15" />
      <stop
         offset="1"
         stop-color="#FFC400"
         id="stop16" />
    </linearGradient>
  </defs>
  <!-- No background rect: fully transparent -->
  <g
     id="logo"
     style="display:inline">
    <!-- Gray right leg (back layer) -->
    <path
       id="gray-leg"
       fill="url(#gradGray)"
       d="M 715.08203,605.92578 955,592 1172,806 H 905 c -25,0 -45,-16 -60,-36 z"
       style="display:inline;fill:url(#gradGray)" />
    <!-- Lower bowl (yellow) -->
    <!-- Left leg (orange) -->
    <path
       id="leg-left"
       fill="url(#gradLeg)"
       d="M 365,806 630,528 c 60.32967,-64.33336 140,-52 220,-52 -56.08344,13.60772 -103.61768,63.88481 -135,130 -25,54 -65,134 -105,169 -30,25 -62,31 -95,31 z"
       style="display:inline;fill:url(#gradLeg)" />
    <!-- Orange fold inside bowl -->
    <path
       id="bowl-fold"
       fill="url(#gradFold)"
       d="m 865.25,278 c 150,4 250.409,35.33839 278.409,109.83839 -18.8655,268.73177 -339.35221,212.5206 -417.75221,217.64446 -2.55762,0.16716 -11.04327,0.82235 -10.88555,0.45359 1.85584,-4.3391 24.40981,-55.81115 68.792,-94.50022 11.58893,-10.10237 23.96784,-18.44675 35.21595,-24.06125 15.61324,-7.79335 28.47832,-10.82329 28.59385,-10.85372 0.82444,-0.21712 1.5557,-0.4639 2.35179,-0.59494 13.10934,-1.70655 27.0386,-5.01979 45.06137,-15.30417 17.18911,-9.80866 30.27347,-25.48999 32.82092,-29.27111 2.91568,-4.32768 5.8492,-8.37113 7.93285,-13.0657 2.40896,-5.4275 5.20162,-11.19066 6.9405,-18.97346 1.29187,-5.19399 1.80698,-9.87125 2.17173,-15.25771 C 947.90907,339.64888 918.85811,297.65631 865.25,278 Z"
       style="display:inline;fill:url(#gradFold)" />
    <!-- Top bar + outer bowl (yellow) -->
    <path
       id="bar-top"
       fill="url(#gradTop)"
       d="m 422,135 h 483 c 155,0 239.6071,115.00065 240,235 0.027,8.26614 -0.3132,12.73808 -0.746,15.11991 -0.4273,2.35206 -0.586,2.73 -0.5924,2.71421 C 1104.3584,291.37379 963.51649,283.31327 860,278 H 640 c -50,0 -95,-23 -120,-48 z"
       style="display:inline;fill:url(#gradTop)" />
    <!-- Node connector -->
    <line
       id="node-line"
       x1="499.87524"
       y1="522.08502"
       x2="653.383"
       y2="400.60129"
       stroke="url(#gradLine)"
       stroke-width="15.174"
       stroke-linecap="round"
       style="display:inline;stroke:url(#gradLine);stroke-width:24;stroke-dasharray:none" />
    <!-- Nodes -->
    <circle
       id="node-1"
       fill="#ffffff"
       stroke="#ffb800"
       stroke-width="8.05085"
       style="display:inline;stroke-width:15;stroke-dasharray:none"
       cy="388"
       cx="674"
       r="43.474575" />
    <circle
       id="node-2"
       cx="496.5"
       cy="526.5"
       fill="#ffffff"
       stroke="#ffb800"
       stroke-width="8.7963"
       style="display:inline;fill:#ffffff;fill-opacity:1;stroke-width:15;stroke-linejoin:round;stroke-dasharray:none"
       r="43.101852" />
  </g>
  <metadata
     id="metadata16">
    <c2pa:manifest></c2pa:manifest>
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>R Logo</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
